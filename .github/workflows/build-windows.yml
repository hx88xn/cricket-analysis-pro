name: Build Windows Installer

# Build the CRICPRO Windows installer on a real Windows runner.
# Triggers:
#   - manually from the Actions tab (workflow_dispatch)
#   - on any tag like v1.0.0 (also publishes a GitHub Release)
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload the installer as a downloadable artifact on every run
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CRICPRO-Windows-Installer
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

      # When triggered by a version tag, also attach the .exe to a GitHub Release
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
